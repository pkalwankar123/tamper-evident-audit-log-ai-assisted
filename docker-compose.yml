# Local PostgreSQL for running the service against a real database.
#
# No credential is hardcoded here: POSTGRES_PASSWORD has no default, so
# `docker compose up` fails fast if AUDIT_DB_PASSWORD is not exported. A committed
# password - even one labelled "local only" - is a credential in version control, and
# compose files have a habit of being reused in environments they were not written for.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:?set AUDIT_DB_NAME}
      POSTGRES_USER: ${AUDIT_DB_USERNAME:?set AUDIT_DB_USERNAME}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?set AUDIT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - audit-postgres:/var/lib/postgresql/data
volumes:
  audit-postgres:
