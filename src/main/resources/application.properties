# =====================================================================
# Base configuration - shared, non-secret settings only.
#
# There are NO credentials, keys or identity bindings in this file, and no
# ":default" fallback that could stand in for one. Environment-specific values
# live in the profile that needs them:
#   application-dev.properties   - local development (activate: --spring.profiles.active=dev)
#   application-prod.properties  - production        (activate: --spring.profiles.active=prod)
#   src/test/resources/application.properties - the test suite
#
# Running with NO profile deliberately yields a service with no identity
# bindings, so every request is denied. That is the fail-closed default: an
# unconfigured deployment refuses work rather than guessing who the caller is.
# =====================================================================
spring.application.name=tamper-evident-audit-log
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Never expose the H2 console. Overridden nowhere.
spring.h2.console.enabled=false

server.port=8080
server.shutdown=graceful

# Request/payload limits. The service-layer check on audit.payload.max-bytes is
# authoritative; these stop an oversized request before it is buffered and parsed.
server.max-http-request-header-size=16KB
server.tomcat.max-swallow-size=1MB
server.tomcat.max-http-form-post-size=65536
server.tomcat.connection-timeout=10s

# Error responses carry no internals.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

audit.retention.enabled=false
audit.retention.days=365
audit.retention.cron=0 0 2 * * *

# Signing: no key material and no ephemeral fallback here. A profile must supply
# either KMS/secret-store-injected keys or a durable store path, or startup fails.
audit.signing.allow-ephemeral=false

# CSRF: explicitly off. This is a stateless API authenticated per request by a
# bearer token or Basic header, issuing no session cookie, so there is no ambient
# credential for a cross-site request to ride. Set this to true if the service is
# ever placed behind a cookie/session browser flow.
audit.security.csrf-enabled=false

# CORS: deny by default. Only origins listed explicitly are permitted, and '*' is
# rejected in production.
audit.security.cors.allowed-origins=${AUDIT_CORS_ALLOWED_ORIGINS:}

audit.security.oidc.enabled=${AUDIT_OIDC_ENABLED:false}
audit.security.oidc.issuer-uri=${AUDIT_OIDC_ISSUER_URI:}
audit.security.oidc.jwk-set-uri=${AUDIT_OIDC_JWK_SET_URI:}
audit.security.oidc.audience=${AUDIT_OIDC_AUDIENCE:}

# Token claim names used to derive the actor and tenant. Never read from a request body.
audit.identity.actor-claim=sub
audit.identity.tenant-claim=tenant_id
audit.identity.roles-claim=roles

audit.payload.max-bytes=65536

audit.rate-limit.enabled=true
audit.rate-limit.requests-per-minute=${AUDIT_RATE_LIMIT_PER_MINUTE:120}

# Idempotency keys are optional by default and durable when supplied.
audit.idempotency.required=false
audit.idempotency.retention-hours=24
