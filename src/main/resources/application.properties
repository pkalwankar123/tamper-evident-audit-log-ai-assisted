spring.application.name=tamper-evident-audit-log
spring.datasource.url=jdbc:h2:file:./data/auditdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.port=8080

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

audit.retention.enabled=false
audit.retention.days=365
audit.retention.cron=0 0 2 * * *
audit.signing.key-id=local-dev-key
audit.signing.private-key-base64=${AUDIT_SIGNING_PRIVATE_KEY_BASE64:}
audit.signing.public-key-base64=${AUDIT_SIGNING_PUBLIC_KEY_BASE64:}
audit.security.writer-password=${AUDIT_SECURITY_WRITER_PASSWORD:writer-dev-pass}
audit.security.reader-password=${AUDIT_SECURITY_READER_PASSWORD:reader-dev-pass}
audit.security.admin-password=${AUDIT_SECURITY_ADMIN_PASSWORD:admin-dev-pass}
