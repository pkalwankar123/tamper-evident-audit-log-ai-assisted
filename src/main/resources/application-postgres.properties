# PostgreSQL datasource, for running against a real database locally or in CI.
#
# No credential defaults: supply DB_URL / DB_USERNAME / DB_PASSWORD or the
# context fails to build. Combine with the dev profile for local identity
# bindings, e.g. --spring.profiles.active=dev,postgres
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
