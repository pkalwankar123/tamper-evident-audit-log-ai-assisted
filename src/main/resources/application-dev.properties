# =====================================================================
# Local development profile.  Activate with: --spring.profiles.active=dev
#
# Contains no secret. The three Basic-auth users have no password configured, so
# SecurityConfig generates a random one per run and logs it - a developer copies
# it from the console. That is the whole point: convenience without a fixed
# credential living in version control.
#
# Anything here is unsuitable for production by construction, and the prod
# profile is validated at startup to make sure none of it leaks across.
# =====================================================================

spring.datasource.url=jdbc:h2:file:./data/auditdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=${AUDIT_DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# Basic auth: local only. Passwords are generated at startup unless supplied.
audit.security.basic.enabled=true
audit.security.basic.writer-password=${AUDIT_SECURITY_WRITER_PASSWORD:}
audit.security.basic.reader-password=${AUDIT_SECURITY_READER_PASSWORD:}
audit.security.basic.admin-password=${AUDIT_SECURITY_ADMIN_PASSWORD:}

# Identity bindings for the local users. These map a login onto the (actorId,
# tenantId) pair the service will trust; in production the same two values come
# from token claims instead, and this table is unused.
audit.identity.principals.writer.actor-id=advisor-17
audit.identity.principals.writer.tenant-id=tenant-a
audit.identity.principals.reader.actor-id=advisor-17
audit.identity.principals.reader.tenant-id=tenant-a
audit.identity.principals.admin.actor-id=admin-local
audit.identity.principals.admin.tenant-id=tenant-a

# Durable signing keys on local disk. Not a KMS, but it does survive a restart,
# so exports signed yesterday still verify today. The file is created on first
# run; delete it and every earlier signature becomes unverifiable, which is
# exactly the failure mode the ephemeral fallback used to cause silently.
audit.signing.key-id=local-dev-key
audit.signing.store-path=${AUDIT_SIGNING_STORE_PATH:./data/signing-keys.json}

# API docs are reachable without credentials in dev only.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
