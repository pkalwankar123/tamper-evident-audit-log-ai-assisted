# =====================================================================
# Production profile.  Activate with: --spring.profiles.active=prod
#
# Two independent mechanisms keep this fail-closed:
#
#  1. Every ${VAR} below has NO default. An unset variable is an unresolvable
#     placeholder and the context refuses to build.
#  2. ProductionSecurityValidator runs at startup and checks the conditions a
#     placeholder cannot express - Basic auth still enabled, ephemeral signing
#     keys, TLS neither terminated here nor declared as terminated upstream,
#     wildcard CORS, H2, Swagger, automatic schema updates. It reports every
#     failure at once and aborts.
#
# Do not add a ":default" fallback to any line in this file.
# =====================================================================

# --- Database -------------------------------------------------------
# A real, access-controlled database. H2 is rejected by the validator.
spring.datasource.url=${AUDIT_DB_URL}
spring.datasource.username=${AUDIT_DB_USERNAME}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes to an append-only audit store go through reviewed migrations,
# never an automatic update.
spring.jpa.hibernate.ddl-auto=validate

# --- Authentication -------------------------------------------------
# OIDC/OAuth2 only. Credential handling, session lifetime and MFA are the
# identity provider's responsibility, which is where they belong - this service
# validates tokens and derives (actorId, tenantId) from their claims.
audit.security.oidc.enabled=true
audit.security.oidc.issuer-uri=${AUDIT_OIDC_ISSUER_URI}
audit.security.oidc.audience=${AUDIT_OIDC_AUDIENCE}

# The in-memory Basic-auth users do not exist in production.
audit.security.basic.enabled=false

# --- Signing keys ---------------------------------------------------
# Injected from a KMS / secret manager. No ephemeral fallback: a key that does
# not survive a restart invalidates every previously exported bundle and every
# stored checkpoint. Rotation happens in the KMS; supply the new key id and
# material, and retain the old public key for verifying earlier evidence.
audit.signing.key-id=${AUDIT_SIGNING_KEY_ID}
audit.signing.private-key-base64=${AUDIT_SIGNING_PRIVATE_KEY_BASE64}
audit.signing.public-key-base64=${AUDIT_SIGNING_PUBLIC_KEY_BASE64}
audit.signing.allow-ephemeral=false

# --- Transport ------------------------------------------------------
# Either terminate TLS here with a real keystore, or declare explicitly that a
# proxy/ingress does it. The validator refuses to start if neither is true, so
# "we forgot" cannot masquerade as "the load balancer handles it".
audit.security.tls.externally-terminated=${AUDIT_TLS_EXTERNALLY_TERMINATED}
server.ssl.enabled=${AUDIT_TLS_ENABLED}
# When AUDIT_TLS_ENABLED=true, these must also be supplied:
#   server.ssl.key-store=${AUDIT_TLS_KEYSTORE_PATH}
#   server.ssl.key-store-password=${AUDIT_TLS_KEYSTORE_PASSWORD}
#   server.ssl.key-store-type=PKCS12
# Uncomment them together with the certificate; never enable TLS without one.

# --- Exposure -------------------------------------------------------
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.h2.console.enabled=false

# CORS stays deny-by-default; '*' is rejected outright.
audit.security.cors.allowed-origins=${AUDIT_CORS_ALLOWED_ORIGINS:}

# --- Operational ----------------------------------------------------
audit.retention.enabled=true
audit.rate-limit.enabled=true

# Identity comes from token claims. Adjust only if the IdP uses different names.
audit.identity.actor-claim=sub
audit.identity.tenant-claim=tenant_id
audit.identity.roles-claim=roles
