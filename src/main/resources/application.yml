spring:
  application:
    name: tamper-evident-audit-log
  datasource:
    url: jdbc:h2:file:./data/auditdb;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

audit:
  retention:
    enabled: false
    days: 365
    cron: "0 0 2 * * *"
  signing:
    key-id: local-dev-key
    private-key-base64: ${AUDIT_SIGNING_PRIVATE_KEY_BASE64:}
    public-key-base64: ${AUDIT_SIGNING_PUBLIC_KEY_BASE64:}
