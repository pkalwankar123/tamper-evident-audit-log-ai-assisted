# =====================================================================
# Test configuration - isolated from both dev and prod.
#
# The passwords below are test fixtures, not secrets: they exist so the suite can
# authenticate deterministically against an in-memory database that is created and
# destroyed per run. Nothing here is reachable from a deployed instance, and the
# prod profile disables Basic authentication entirely.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:audit-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

audit.retention.enabled=false
audit.retention.days=365

# Ephemeral keys are opted into explicitly, and only here. Every test that cares
# about key durability (restart, rotation) exercises FileSigningKeyStore directly
# against a temporary directory instead of relying on this.
audit.signing.key-id=test-key
audit.signing.allow-ephemeral=true

audit.security.basic.enabled=true
audit.security.basic.writer-password=test-writer-password
audit.security.basic.reader-password=test-reader-password
audit.security.basic.admin-password=test-admin-password

# Local Basic principals, all in tenant-a. Cross-tenant scenarios are driven with
# JWT claims (tenant-b) and directly at the service layer, so tenant isolation is
# proven rather than assumed.
audit.identity.principals.writer.actor-id=advisor-17
audit.identity.principals.writer.tenant-id=tenant-a
audit.identity.principals.reader.actor-id=advisor-17
audit.identity.principals.reader.tenant-id=tenant-a
audit.identity.principals.admin.actor-id=admin-a
audit.identity.principals.admin.tenant-id=tenant-a

audit.payload.max-bytes=65536

# A high ceiling so the suite's request volume never trips the limiter and masks an
# unrelated failure. RateLimitFilterTest overrides it with a low ceiling of its own.
audit.rate-limit.enabled=true
audit.rate-limit.requests-per-minute=100000

audit.idempotency.required=false
